<!doctype html>
<!-- Link-preview image (WhatsApp, Facebook, X, Telegram, LinkedIn): rendered to public/og-<lang>.png by scripts/icons.ts. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Familjen+Grotesk:wght@600;700&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{display:grid;grid-template-columns:640px 1fr;background:#1f4a29;color:#fff;font-family:'Familjen Grotesk',sans-serif}
  .left{padding:64px 0 56px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:18px;font-size:40px;font-weight:700;letter-spacing:-.035em}
  .brand img{width:64px;height:64px}
  h1{margin:0;font-size:62px;line-height:1.04;letter-spacing:-.025em;max-width:13ch}
  .url{font-size:26px;opacity:.75}
  .right{position:relative}
  .page{position:absolute;left:30px;top:70px;width:470px;height:520px;transform:rotate(3deg);border-radius:6px 18px 18px 6px;border-left:12px solid #2f6b3b;
    background:linear-gradient(90deg,transparent 54px,#d23c35 54px,#d23c35 57px,transparent 57px),repeating-linear-gradient(transparent 0 45px,#cfe0f1 45px 47px),#fff;
    padding:38px 30px 0 78px;box-sizing:border-box;color:#24334f;font-family:'Caveat',cursive;font-size:38px;line-height:47px}
  .dish{font-size:46px;color:#1f4a29;text-decoration:underline 3px #d23c35;text-underline-offset:9px}
  mark{background:linear-gradient(transparent 22%,rgba(246,201,69,.8) 22% 88%,transparent 88%);color:inherit}
</style></head>
<body>
  <div class="left">
    <div class="brand"><img src="../public/favicon.svg" alt="">bukuresipi</div>
    <h1 id="h"></h1>
    <div class="url">bukuresipi.com</div>
  </div>
  <div class="right"><div class="page">
    <div class="dish">Ayam masak merah</div>
    <div id="l1"></div><div id="l2"></div><div id="l3"></div>
  </div></div>
<script>
  const en = new URLSearchParams(location.search).get('lang') === 'en'
  document.getElementById('h').textContent = en ? 'Recipes and food spots from TikTok, kept in one book.' : 'Resipi dan kedai makan dari TikTok, tersimpan dalam satu buku.'
  const lines = en ? [['2 whole',' chickens'],['10',' dried chillies'],['3 tbsp',' tomato sauce']] : [['2 ekor',' ayam'],['10 tangkai',' cili kering'],['3 sudu besar',' sos tomato']]
  lines.forEach(([q, r], i) => { const d = document.getElementById('l' + (i + 1)); d.innerHTML = '- <mark></mark>'; d.querySelector('mark').textContent = q; d.append(r) })
</script>
</body></html>
